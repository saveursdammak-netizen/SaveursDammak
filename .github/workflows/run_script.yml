name: Automatisation Saveurs Dammak

on:
  workflow_dispatch: # Permet de lancer le script manuellement à tout moment
  schedule:
    # Exécution toutes les heures de 7h00 à 21h00 UTC
    # Ce qui correspond exactement de 8h00 à 22h00 heure de Sfax (15 fois par jour)
    - cron: '0 7-21 * * *'

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lancer le script Python
      run: python publication_telegram.py
