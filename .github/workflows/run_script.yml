name: Automatisation Saveurs Dammak

on:
  workflow_dispatch: # Permet de lancer le script manuellement depuis GitHub à tout moment
  schedule:
    # Exécution programmée tous les jours à 18h00 heure locale (Tunisie / UTC+1)
    # Ce qui correspond à 17h00 UTC
    - cron: '0 17 * * *'

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lancer le script Python
      run: python publication_telegram.py
